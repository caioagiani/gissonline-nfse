name: Release

# semantic-release reads the conventional commits pushed to main, works out the
# next version, writes the changelog, tags, and opens the GitHub release. The
# npm publish runs as a separate step so it can authenticate through trusted
# publishing (OIDC) rather than a token — @semantic-release/npm has npmPublish
# turned off for that reason.
#
# The version commit carries [skip ci] so it does not trigger this workflow again.
#
# The filename matters: npm trusted publishing is configured against
# `release.yml` for this repository. Renaming this file breaks OIDC auth.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Decides the version, writes CHANGELOG.md, commits, tags and creates the
      # GitHub release. Does not publish.
      - name: Version and tag
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Did the version change?
        id: check
        run: |
          published=$(npm view gissonline-nfse version 2>/dev/null || echo none)
          current=$(node -p "require('./package.json').version")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$current" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $current is already on npm — nothing to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $current (npm has $published)."
          fi

      # No NODE_AUTH_TOKEN: the credential comes from this workflow's OIDC
      # identity. Provenance is generated automatically in this mode.
      - name: Publish to npm
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public
