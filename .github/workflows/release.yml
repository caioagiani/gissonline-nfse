name: Release

# release-please watches main, reads the conventional commits since the last
# release and keeps a pull request open with the next version and the changelog
# already worked out. Merging that pull request cuts the release: the tag is
# created and this same run publishes to npm.
#
# Publishing and versioning live in one workflow on purpose. The default
# GITHUB_TOKEN does not trigger other workflows, so a tag created here would
# never wake a separate publish job.
#
# The filename matters: npm trusted publishing is configured against
# `release.yml` for this repository. Renaming this file breaks OIDC auth.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below only runs on the push that merges the release PR.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@latest

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run typecheck
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      # No NODE_AUTH_TOKEN: the credential comes from this workflow's OIDC
      # identity. Provenance is generated automatically in this mode.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --access public
