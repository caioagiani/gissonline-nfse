name: Release

# Publica quando uma tag v*.*.* chega. Para versionar:
#   npm version patch|minor|major
#   git push --follow-tags
on:
  push:
    tags: ["v*.*.*"]

# Autenticação por Trusted Publishing (OIDC): nenhum token de npm envolvido.
# Configure em npmjs.com → gissonline-nfse → Settings → Trusted Publisher,
# apontando para este repositório e para este arquivo (release.yml).
permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # OIDC exige Node >= 22.14 e npm >= 11.5.1
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      # Sem NODE_AUTH_TOKEN: a credencial vem do OIDC do próprio workflow.
      # O provenance é gerado automaticamente nesse modo.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
